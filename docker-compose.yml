services:

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://database:27017/vaccineDB
      PORT: 5000
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - vaccine_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vaccine_data: